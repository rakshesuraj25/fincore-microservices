# ==========================================
# FinCore API Gateway
# ==========================================

spring.application.name=FINCORE-API-GATEWAY
server.port=8081


# ==========================================
# Eureka Client
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost


# ==========================================
# User Service - Authentication
# ==========================================

spring.cloud.gateway.routes[0].id=user-service-auth
spring.cloud.gateway.routes[0].uri=lb://FINCORE-USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**


# ==========================================
# User Service - User APIs
# ==========================================

spring.cloud.gateway.routes[1].id=user-service-api
spring.cloud.gateway.routes[1].uri=lb://FINCORE-USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/user/**


# ==========================================
# Wallet Service
# ==========================================

spring.cloud.gateway.routes[2].id=wallet-service
spring.cloud.gateway.routes[2].uri=lb://FINCORE-WALLET-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/wallet/**


# ==========================================
# Transaction Service
# ==========================================

spring.cloud.gateway.routes[3].id=transaction-service
spring.cloud.gateway.routes[3].uri=lb://FINCORE-TRANSACTION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/transactions/**


# ==========================================
# Payment Service
# ==========================================

spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=lb://FINCORE-PAYMENT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/payments/**