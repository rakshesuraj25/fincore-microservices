services:

  # =========================================================
  # MySQL
  # =========================================================
  mysql:
    image: mysql:8.0
    container_name: fincore-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # =========================================================
  # Kafka
  # =========================================================
  kafka:
    image: apache/kafka:3.7.2
    container_name: fincore-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data


  # =========================================================
  # Eureka Server
  # =========================================================
  eureka-server:
    build:
      context: ./eureka-server

    container_name: fincore-eureka
    restart: unless-stopped

    ports:
      - "8761:8761"

    environment:
      SERVER_PORT: 8761

    depends_on:
      mysql:
        condition: service_healthy


  # =========================================================
  # User Service
  # =========================================================
  user-service:
    build:
      context: ./user-service

    container_name: fincore-user-service
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:

      SERVER_PORT: 8080

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: user-service

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vaultopay?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started


  # =========================================================
  # Wallet Service
  # =========================================================
  wallet-service:
    build:
      context: ./wallet-service

    container_name: fincore-wallet-service
    restart: unless-stopped

    ports:
      - "8082:8082"

    environment:

      SERVER_PORT: 8082

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: wallet-service

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fincore_wallet?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started


  # =========================================================
  # Transaction Service
  # =========================================================
  transaction-service:
    build:
      context: ./transaction-service

    container_name: fincore-transaction-service
    restart: unless-stopped

    ports:
      - "8083:8083"

    environment:

      SERVER_PORT: 8083

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: transaction-service

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fincore_transaction?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started


  # =========================================================
  # Payment Service
  # =========================================================
  payment-service:
    build:
      context: ./payment-service

    container_name: fincore-payment-service
    restart: unless-stopped

    ports:
      - "8084:8084"

    environment:

      SERVER_PORT: 8084

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: payment-service

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fincore_payment?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started


  # =========================================================
  # API Gateway
  # =========================================================
  api-gateway:
    build:
      context: ./api-gateway

    container_name: fincore-api-gateway
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:

      SERVER_PORT: 8081

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway

    depends_on:
      eureka-server:
        condition: service_started
      user-service:
        condition: service_started
      wallet-service:
        condition: service_started
      transaction-service:
        condition: service_started
      payment-service:
        condition: service_started


# ===========================================================
# Persistent Volumes
# ===========================================================

volumes:

  mysql_data:

  kafka_data: