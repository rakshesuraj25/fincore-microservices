name: FinCore Docker CI/CD

on:
  workflow_run:
    workflows:
      - FinCore CI
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and Push Docker Images
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - eureka-server
          - user-service
          - wallet-service
          - transaction-service
          - payment-service

    steps:
      - name: Checkout successful commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fincore-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/fincore-${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}
